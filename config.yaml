paths:
  raw_csv: data/raw/transactions.csv
  external_dir: data/external
  interim_dir: data/interim
  processed_dir: data/processed
  reports_dir: outputs/reports
  figures_dir: outputs/figures
  logs_dir: outputs/logs

  transactions_clean: data/interim/transactions_clean.parquet
  dq_report: outputs/reports/data_quality_report.json

  transactions_enriched: data/processed/transactions_enriched.parquet
  user_features: data/processed/user_features.parquet
  feature_dictionary: data/processed/feature_dictionary.csv
  demographic_feasibility: data/processed/demographic_feasibility.csv
  feature_meta: data/processed/feature_meta.json

  user_segments: data/processed/user_segments.parquet
  segment_profiles: data/processed/segment_profiles.json
  segment_model: data/processed/segmentation_model.joblib

  report_pdf: outputs/reports/transaction_insights_report.pdf
  analysis_results: outputs/reports/analysis_results.json

cleaning:
  csv_sep: ";"
  missing_tokens: ["", "na", "n/a", "null", "none", "nan", "-", "?"]
  category_columns:
    payment_method: ["balance", "credit_card"]
    transaction_status: ["completed", "failed"]
    loyalty_program: ["yes", "no"]
    discount_applied: ["yes", "no"]
    transaction_notes: ["yes", "no"]
    is_refunded: ["yes", "no"]
  date_format: "%d/%m/%Y"
  legacy_os_thresholds:
    Android: 8.0
    iOS: null   # iPhone/iPad version not present in user_agent; not evaluated

geo:
  boundary_url: "https://raw.githubusercontent.com/rifani/geojson-political-indonesia/master/IDN_adm_2_kabkota.json"
  boundary_file: "IDN_adm_2_kabkota.json"
  province_col: "NAME_1"
  regency_col: "NAME_2"
  type_col: "TYPE_2"
  nearest_max_km: 50
  name_normalization:
    provinces:
      "Jakarta Raya": "DKI Jakarta"
      "Yogyakarta": "DI Yogyakarta"
    city_type_map:
      "Kotamadya": "Kota"
      "Kabupaten": "Kabupaten"
      "Unknown": "Kabupaten"
  region_groups:
    "Jabodetabek": ["Kota Jakarta Pusat", "Kota Jakarta Selatan", "Kota Jakarta Utara",
                     "Kota Jakarta Barat", "Kota Jakarta Timur", "Kota Depok",
                     "Kota Bekasi", "Kota Bogor", "Kota Tangerang"]
    "Central Java & DIY": ["Kota Semarang", "Kabupaten Bantul"]
    "East Java": ["Kota Surabaya", "Kota Malang"]
  fallback_centroids:
    "Kota Jakarta Pusat": {province: "DKI Jakarta", lat: -6.1862, lon: 106.8347, city_type: "Kota"}
    "Kota Jakarta Selatan": {province: "DKI Jakarta", lat: -6.2615, lon: 106.8106, city_type: "Kota"}
    "Kota Surabaya": {province: "Jawa Timur", lat: -7.2575, lon: 112.7521, city_type: "Kota"}
    "Kota Tangerang": {province: "Banten", lat: -6.1783, lon: 106.6319, city_type: "Kota"}
    "Kota Depok": {province: "Jawa Barat", lat: -6.4025, lon: 106.7942, city_type: "Kota"}
    "Kota Bekasi": {province: "Jawa Barat", lat: -6.2383, lon: 106.9756, city_type: "Kota"}
    "Kota Bogor": {province: "Jawa Barat", lat: -6.5971, lon: 106.8060, city_type: "Kota"}
    "Kabupaten Bantul": {province: "DI Yogyakarta", lat: -7.8877, lon: 110.3286, city_type: "Kabupaten"}
    "Kota Malang": {province: "Jawa Timur", lat: -7.9666, lon: 112.6326, city_type: "Kota"}
    "Kota Semarang": {province: "Jawa Tengah", lat: -6.9932, lon: 110.4203, city_type: "Kota"}

calendar:
  lebaran_start: "2024-04-07"
  lebaran_end: "2024-04-13"
  payday_days: [25, 26, 27, 28, 29, 30, 31, 1, 2, 3]

assumptions:
  transaction_amount_is_gross: true   # transaction_amount is recorded before discount
  mdr:
    balance: 0.007
    credit_card: 0.022

analysis:
  alpha: 0.05
  min_users_per_merchant: 20
  os_coverage_target: 0.90

segmentation:
  random_state: 42
  k_min: 3
  k_max: 6
  # Monetary features are log1p-transformed before scaling (right-skewed).
  log_features: ["avg_net_amount"]
  features:
    - recency_days
    - active_months
    - n_valid_purchases
    - avg_net_amount
    - cv_net_amount
    - category_entropy
    - merchant_diversity
    - merchant_repeat_ratio
    - discount_tx_share
    - credit_card_share
    - failure_rate
    - refund_rate
    - weekend_share
    - lebaran_lift
    - loyalty_member
  # Features used only to profile/describe segments after they are formed, never to form them.
  profiling_features:
    - total_net_amount
    - primary_city
    - primary_province
    - primary_region_group
    - payment_profile
    - os_family
    - is_legacy_os
    - is_promo_user
    - avg_rating
    - openness_score
    - conscientiousness_score
    - extraversion_score
    - agreeableness_score
    - neuroticism_score
    - income_proxy_tier
    - gender_lean_signal
    - age_bracket_estimate
    - education_signal
    - work_location_estimate
    - working_status_estimate
    - marital_family_proxy

mcc:
  "4722": {description: "Travel Agencies", group: "Travel"}
  "5251": {description: "Hardware Stores", group: "Home"}
  "5311": {description: "Department Stores", group: "Retail"}
  "5411": {description: "Grocery Stores/Supermarkets", group: "Essentials"}
  "5412": {description: "Non-standard/Misc MCC", group: "Other"}
  "5541": {description: "Service Stations (Fuel)", group: "Vehicle"}
  "5651": {description: "Family Clothing Stores", group: "Retail"}
  "5661": {description: "Shoe Stores", group: "Retail"}
  "5712": {description: "Furniture Stores", group: "Home"}
  "5732": {description: "Electronics Stores", group: "Retail"}
  "5812": {description: "Restaurants", group: "Food & Dining"}
  "5814": {description: "Fast Food Restaurants", group: "Food & Dining"}
  "5912": {description: "Drug Stores/Pharmacies", group: "Health"}
  "5941": {description: "Sporting Goods Stores", group: "Active Lifestyle"}
  "5942": {description: "Book Stores", group: "Retail"}
  "5964": {description: "Direct Marketing/Catalog", group: "Retail"}
  "5999": {description: "Miscellaneous Retail", group: "Retail"}
  "7230": {description: "Beauty/Barber Shops", group: "Personal Care"}
  "7994": {description: "Video Game Arcades", group: "Entertainment"}
  "8211": {description: "Elementary/Secondary Schools", group: "Education"}
  "8220": {description: "Colleges/Universities", group: "Education"}

mcc_social: ["5812", "5814", "7994"]
mcc_essential: ["5411", "5912"]

demographics:
  # Exploratory, weak-signal proxies for demographic attributes that have no direct field
  # in this dataset. All are reported with a confidence tier and are documented as
  # heuristics, not validated predictions.
  gender_lean:
    # Based on common retail-category stereotypes, NOT biological or social fact. Used only
    # as an exploratory segmentation input; output is a "lean" score with mostly low/none
    # confidence, never a claimed identity. Flagged explicitly in the report as an ethical
    # caution point.
    female_lean_mcc: ["7230", "5651"]   # Beauty/Barber Shops, Family Clothing Stores
    male_lean_mcc: ["5541", "5941", "5251", "7994"]  # Fuel, Sporting Goods, Hardware, Arcades
  working_status:
    min_valid_purchases: 5
    payday_share_threshold: 0.3
    weekend_share_max: 0.5
  marital_family_proxy:
    # Geo per transaction is scattered across cities for most users in this dataset (median
    # primary_city_share is exactly 0.5), so a strict "single city only" rule leaves almost
    # no one eligible. Use a share threshold instead of requiring zero multi-city activity.
    min_primary_city_share: 0.5
